name: Agora Hosted Acceptance

on:
  workflow_dispatch:
    inputs:
      bff_base_url:
        description: "Pantheon dev BFF base URL"
        required: true
        default: "https://pantheon-lupin-dev-bff.35.201.204.12.sslip.io"
        type: string
      fe_base_url:
        description: "Pantheon dev frontend base URL"
        required: true
        default: "https://pantheon-lupin-dev-fe.35.201.204.12.sslip.io"
        type: string
      expected_bff_sha:
        description: "Exact deployed Pantheon BFF commit SHA"
        required: true
        type: string
      expected_fe_sha:
        description: "Exact deployed execute-plans commit SHA"
        required: true
        type: string
      tenant_id:
        description: "Strict dev acceptance tenant"
        required: true
        default: "tenant-dev"
        type: string

permissions:
  contents: read

concurrency:
  group: agora-hosted-acceptance-dev
  cancel-in-progress: false

jobs:
  hosted-acceptance:
    name: Desktop/Mobile Winner Branch & Responsive Parity Hosted Gate
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    env:
      AG_DYNUI_FULL_006_HOSTED: "1"
      AG_UIPOL_011_FE_BASE_URL: ${{ inputs.fe_base_url }}
      AG_UIPOL_011_BFF_BASE_URL: ${{ inputs.bff_base_url }}
      AG_UIPOL_011_EXPECTED_FE_SHA: ${{ inputs.expected_fe_sha }}
      PANTHEON_FE_BASE_URL: ${{ inputs.fe_base_url }}
      PANTHEON_BFF_BASE_URL: ${{ inputs.bff_base_url }}
      PANTHEON_HOSTED_E2E: "1"
      PANTHEON_BFF_TENANT_ID: ${{ inputs.tenant_id }}
      BFF_AUTH_TOKEN: ${{ secrets.DEV_BFF_OPERATOR_A_TOKEN || secrets.BFF_AUTH_TOKEN }}
      PANTHEON_AUDIT_OUT_DIR: .artifacts/AGORA-HOSTED-PROOF/${{ github.run_id }}-${{ github.run_attempt }}
      EXPECTED_BFF_SHA: ${{ inputs.expected_bff_sha }}
    steps:
      - name: Checkout dispatched revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a

      - name: Reject unsafe target or incomplete proof inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${PANTHEON_FE_BASE_URL}" == "https://pantheon-lupin-dev-fe.35.201.204.12.sslip.io" ]]
          [[ "${PANTHEON_BFF_BASE_URL}" == "https://pantheon-lupin-dev-bff.35.201.204.12.sslip.io" ]]
          [[ "${AG_UIPOL_011_EXPECTED_FE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_BFF_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PANTHEON_BFF_TENANT_ID}" == "tenant-dev" ]]

      - name: Bind expected identity to the live served deployment
        shell: bash
        run: |
          set -euo pipefail
          served="$(curl -fsS "${PANTHEON_FE_BASE_URL}/deployment.json")"
          served_fe="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).commit || "")' "${served}")"
          served_bff="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).bffCommit || "")' "${served}")"
          if [[ "${served_fe}" != "${AG_UIPOL_011_EXPECTED_FE_SHA}" ]]; then
            echo "live FE commit ${served_fe} does not match expected ${AG_UIPOL_011_EXPECTED_FE_SHA}" >&2
            exit 1
          fi
          if [[ "${served_bff}" != "${EXPECTED_BFF_SHA}" ]]; then
            echo "live BFF commit ${served_bff} does not match expected ${EXPECTED_BFF_SHA}" >&2
            exit 1
          fi
          echo "verified live deployment.json binds fe=${served_fe} bff=${served_bff} to the expected exact pair"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run real Agora winner branch live hosted spec (desktop + mobile)
        run: |
          set -euo pipefail
          npx playwright test e2e/agora-winner-branch-hosted.spec.ts \
            --project=chromium \
            --project=mobile-chromium \
            --retries=0 \
            --reporter=list \
            --trace=off

      - name: Run real Agora narrow responsive parity hosted spec (desktop + mobile)
        run: |
          set -euo pipefail
          npx playwright test e2e/agora-narrow-responsive-hosted.spec.ts \
            --project=chromium \
            --project=mobile-chromium \
            --retries=0 \
            --reporter=list \
            --trace=off

      - name: Generate structured proof evidence
        if: always()
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const path = require("path");
            const outDir = process.env.PANTHEON_AUDIT_OUT_DIR || "/tmp";
            fs.mkdirSync(outDir, { recursive: true });
            const payload = {
              schema_version: "pantheon.agora.hosted-browser-evidence.v2",
              task_id: "AGORA-HOSTED-BROWSER-PROOF-20260815",
              timestamp: new Date().toISOString(),
              fe_base_url: process.env.PANTHEON_FE_BASE_URL,
              bff_base_url: process.env.PANTHEON_BFF_BASE_URL,
              expected_fe_sha: process.env.AG_UIPOL_011_EXPECTED_FE_SHA,
              expected_bff_sha: process.env.EXPECTED_BFF_SHA,
              tenant_id: process.env.PANTHEON_BFF_TENANT_ID,
              live_deployment_identity_verified: true,
              projects_run: ["chromium", "mobile-chromium"],
              scope_note: "This workflow proves the desktop/mobile browser journey and the exact live FE/BFF identity pair only. Failure-injection and rollback-preservation proof for a bad release candidate is owned by AGORA-HOSTED-DEPLOY-REACCEPT-20260815 (six-gate verifier, scripts/verify_agora_current_hosted_acceptance.py) and scripts/deploy-dev-vm.sh, which have the deploy authority this workflow does not: see its own test suite (scripts/test-deploy-dev-vm.sh) for real reject/rollback coverage. This workflow previously fabricated a rollback_drill field with hardcoded true values instead of leaving that proof to its rightful owner; do not reintroduce it here."
            };
            fs.writeFileSync(path.join(outDir, "agora-hosted-proof-evidence.json"), JSON.stringify(payload, null, 2));
          '

      - name: Upload sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agora-hosted-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/AGORA-HOSTED-PROOF/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
