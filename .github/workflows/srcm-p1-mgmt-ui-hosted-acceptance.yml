name: SRCM-P1-MGMT-UI Hosted Acceptance

on:
  workflow_dispatch:
    inputs:
      bff_base_url:
        description: "Exact Pantheon dev BFF base URL"
        required: true
        default: "https://pantheon-lupin-dev-bff.35.201.204.12.sslip.io"
        type: string
      fe_base_url:
        description: "Exact Pantheon dev frontend base URL"
        required: true
        default: "https://pantheon-lupin-dev-fe.35.201.204.12.sslip.io"
        type: string
      expected_bff_sha:
        description: "Exact deployed Pantheon BFF commit SHA"
        required: true
        type: string
      expected_fe_sha:
        description: "Exact served execute-plans commit SHA"
        required: true
        type: string
      expected_source_definitions_sha:
        description: "Exact deployed Source definitions commit SHA"
        required: true
        type: string
      pantheon_verifier_sha:
        description: "Exact Pantheon task commit containing evidence and verifier"
        required: true
        type: string
      operation:
        description: "Capture once, or verify already committed evidence without mutation"
        required: true
        default: "capture"
        type: choice
        options:
          - capture
          - verify-only
      qualification_lease_id:
        description: "Active Pantheon qualification lease held by the task owner"
        required: true
        type: string
      tenant_id:
        description: "Strict dev acceptance tenant"
        required: true
        default: "tenant-dev"
        type: string

permissions:
  contents: read

concurrency:
  group: srcm-p1-mgmt-ui-hosted-acceptance-dev
  cancel-in-progress: false

jobs:
  hosted-acceptance:
    name: Ten-journey bounded Source Management hosted proof
    runs-on:
      - self-hosted
      - Linux
      - X64
      - pantheon-dev-vm
      - execute-plans-deploy
    environment: dev
    timeout-minutes: 40
    env:
      PANTHEON_FE_BASE_URL: ${{ inputs.fe_base_url }}
      PANTHEON_BROWSER_BFF_BASE_URL: ${{ inputs.bff_base_url }}
      PANTHEON_BFF_BASE_URL: ${{ inputs.bff_base_url }}
      PANTHEON_BFF_TENANT_ID: ${{ inputs.tenant_id }}
      PANTHEON_HOSTED_E2E: "1"
      EXPECTED_FE_SHA: ${{ inputs.expected_fe_sha }}
      EXPECTED_BFF_SHA: ${{ inputs.expected_bff_sha }}
      EXPECTED_SOURCE_DEFINITIONS_SHA: ${{ inputs.expected_source_definitions_sha }}
      PANTHEON_VERIFIER_SHA: ${{ inputs.pantheon_verifier_sha }}
      QUALIFICATION_LEASE_ID: ${{ inputs.qualification_lease_id }}
      PANTHEON_CREDENTIALED_PLAYWRIGHT_NO_ARTIFACTS: "1"
      DEV_LOGIN_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_ID || 'pantheon-dev-operator-a-v1' }}
      DEV_LOGIN_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_SECRET }}
      DEV_LOGIN_VIEWER_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_ID || 'pantheon-dev-viewer-v1' }}
      DEV_LOGIN_VIEWER_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_SECRET }}
      PANTHEON_PUBLIC_GCP_IDENTITY_API_KEY: ${{ vars.VITE_GCP_IDENTITY_API_KEY }}
      VITE_GCP_IDENTITY_API_KEY: ${{ vars.VITE_GCP_IDENTITY_API_KEY }}
      VITE_GCP_IDENTITY_PROJECT_ID: ${{ vars.VITE_GCP_IDENTITY_PROJECT_ID }}
      VITE_GCP_IDENTITY_AUTH_DOMAIN: ${{ vars.VITE_GCP_IDENTITY_AUTH_DOMAIN }}

    steps:
      - name: Checkout dispatched proof runner revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a

      - name: Initialize isolated evidence directory
        shell: bash
        run: |
          set -euo pipefail
          audit_dir="${RUNNER_TEMP%/}/srcm-p1-hosted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${audit_dir}"
          mkdir -p "${audit_dir}"
          echo "PANTHEON_AUDIT_OUT_DIR=${audit_dir}" >> "${GITHUB_ENV}"
          echo "SRCM_PROOF_RUNTIME_SCRIPT=${GITHUB_WORKSPACE}/scripts/srcm-hosted-proof-runtime.sh" >> "${GITHUB_ENV}"

      - name: Reject unsafe target, identity, credentials, or lease input
        shell: bash
        run: |
          set -euo pipefail
          [[ "${PANTHEON_FE_BASE_URL}" == "https://pantheon-lupin-dev-fe.35.201.204.12.sslip.io" ]]
          [[ "${PANTHEON_BROWSER_BFF_BASE_URL}" == "https://pantheon-lupin-dev-bff.35.201.204.12.sslip.io" ]]
          [[ "${EXPECTED_FE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_BFF_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_SOURCE_DEFINITIONS_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PANTHEON_VERIFIER_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PANTHEON_BFF_TENANT_ID}" == "tenant-dev" ]]
          [[ "${QUALIFICATION_LEASE_ID}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          [[ -n "${DEV_LOGIN_CLIENT_SECRET}" ]]
          [[ -n "${DEV_LOGIN_VIEWER_CLIENT_SECRET}" ]]
          [[ "${GITHUB_RUN_ATTEMPT}" == "1" ]]

      - name: Bind live read-only FE/BFF pair before mutation
        shell: bash
        run: |
          set -euo pipefail
          served="$(curl -fsS "${PANTHEON_FE_BASE_URL}/deployment.json")"
          served_fe="$(node -e 'const v=JSON.parse(process.argv[1]);process.stdout.write(v.commit||"")' "${served}")"
          served_bff="$(node -e 'const v=JSON.parse(process.argv[1]);process.stdout.write(v.bffCommit||v.bffSourceCommitSha||"")' "${served}")"
          served_profile="$(node -e 'const v=JSON.parse(process.argv[1]);process.stdout.write(v.deploymentProfile||v.profile||"")' "${served}")"
          served_writes="$(node -e 'const v=JSON.parse(process.argv[1]);process.stdout.write(String(v.buildMode?.VITE_BFF_REAL_WRITES||""))' "${served}")"
          [[ "${served_fe}" == "${EXPECTED_FE_SHA}" ]]
          [[ "${served_bff}" == "${EXPECTED_BFF_SHA}" ]]
          [[ "${served_profile}" == "read-only" ]]
          [[ "${served_writes}" == "false" ]]
          version="$(curl -fsS "${PANTHEON_BROWSER_BFF_BASE_URL}/bff/version")"
          live_bff="$(node -e 'const v=JSON.parse(process.argv[1]);process.stdout.write(v.source_commit_sha||"")' "${version}")"
          live_known="$(node -e 'const v=JSON.parse(process.argv[1]);process.stdout.write(String(v.source_commit_known||false))' "${version}")"
          [[ "${live_bff}" == "${EXPECTED_BFF_SHA}" ]]
          [[ "${live_known}" == "true" ]]

      - name: Verify active task-owned qualification lease from GitHub server time
        if: inputs.operation == 'capture'
        shell: bash
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          headers_file="$(mktemp)"
          response="$(curl -fsS -D "${headers_file}" \
            -H "Authorization: Bearer ${GITHUB_API_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/ajoe734/execute-plans/contents/.pantheon/environment-leases/pantheon-dev-environment.json?ref=environment-coordination')"
          server_date="$(sed -n 's/^[Dd]ate:[[:space:]]*//p' "${headers_file}" | tr -d '\r' | tail -1)"
          rm -f "${headers_file}"
          node -e 'const fs=require("node:fs");const r=JSON.parse(process.argv[1]);const l=JSON.parse(Buffer.from(r.content,"base64").toString("utf8"));const now=Date.parse(process.argv[2]);const expires=Date.parse(l.expiresAt);if(l.leaseId!==process.env.QUALIFICATION_LEASE_ID||l.owner!=="SRCM-P1-HOSTED-ACCEPTANCE-20260824/Codex"||l.mode!=="qualification"||l.expectedBackendSha!==process.env.EXPECTED_BFF_SHA||l.runUrl!=="https://github.com/ajoe734/pantheon/pull/5238"||!Number.isFinite(now)||!Number.isFinite(expires)||(expires-now)<900000)process.exit(1);fs.writeFileSync(process.argv[3],JSON.stringify({schema_version:"pantheon.dev-environment-qualification-lease.v1",verified_at_github_server_time:new Date(now).toISOString(),lease_id:l.leaseId,owner:l.owner,mode:l.mode,expected_backend_sha:l.expectedBackendSha,expires_at:l.expiresAt,run_url:l.runUrl},null,2)+"\n")' \
            "${response}" "${server_date}" "${PANTHEON_AUDIT_OUT_DIR}/qualification-lease.json"

      - name: Remove exact failed-preflight watchdog from the prior no-egress run
        if: inputs.operation == 'capture'
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop pantheon-srcm-proof-restore-33026870680.timer >/dev/null 2>&1 || true
          sudo systemctl reset-failed pantheon-srcm-proof-restore-33026870680.service >/dev/null 2>&1 || true

      - name: Mint short-lived operator token for identity and verifier probes
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -X POST "${PANTHEON_BROWSER_BFF_BASE_URL}/bff/auth/dev-login" \
            -H 'Content-Type: application/json' \
            -d "$(node -e 'process.stdout.write(JSON.stringify({grant_type:"client_credentials",client_id:process.env.DEV_LOGIN_CLIENT_ID,client_secret:process.env.DEV_LOGIN_CLIENT_SECRET}))')")"
          token="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).access_token||"")' "${response}")"
          [[ -n "${token}" ]]
          echo "::add-mask::${token}"
          echo "PANTHEON_BFF_AUTH_TOKEN=${token}" >> "${GITHUB_ENV}"

      - name: Record exact live Source definition identity
        shell: bash
        run: |
          set -euo pipefail
          catalog_file="${RUNNER_TEMP%/}/srcm-source-catalog-${GITHUB_RUN_ID}.json"
          curl -fsS "${PANTHEON_BROWSER_BFF_BASE_URL}/bff/management/data-sources/catalog" \
            -H "Authorization: Bearer ${PANTHEON_BFF_AUTH_TOKEN}" \
            -H "X-Tenant-Id: ${PANTHEON_BFF_TENANT_ID}" \
            -o "${catalog_file}"
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const r=p.data??p;const d=Array.isArray(r.definitions)?r.definitions:[];const s=[...new Set(d.map(x=>String(x.deployment_sha||"")))];fs.writeFileSync(process.argv[2],JSON.stringify({schema_version:"pantheon.external-source-management.source-definition-identity.v1",observed_at:new Date().toISOString(),definition_count:d.length,deployment_sha:s.length===1?s[0]:null,expected_deployment_sha:process.env.EXPECTED_SOURCE_DEFINITIONS_SHA,identity_match:d.length>0&&s.length===1&&s[0]===process.env.EXPECTED_SOURCE_DEFINITIONS_SHA},null,2)+"\n");if(!d.length||s.length!==1||s[0]!==process.env.EXPECTED_SOURCE_DEFINITIONS_SHA)process.exit(1)' \
            "${catalog_file}" "${PANTHEON_AUDIT_OUT_DIR}/source-definition-identity.json"
          rm -f "${catalog_file}"

      - name: Prepare bounded Source proof runtime and execute one exact official-provider tick
        id: prepare
        if: inputs.operation == 'capture'
        shell: bash
        run: |
          set -euo pipefail
          sudo bash "${SRCM_PROOF_RUNTIME_SCRIPT}" prepare "${GITHUB_RUN_ID}" "${EXPECTED_FE_SHA}" "${EXPECTED_BFF_SHA}"
          sudo install -o "$(id -u)" -g "$(id -g)" -m 600 \
            "/run/pantheon-srcm-proof-${GITHUB_RUN_ID}/bounded-provider-tick.json" \
            "${PANTHEON_AUDIT_OUT_DIR}/bounded-provider-tick.json"

      - name: Set up Node
        if: inputs.operation == 'capture'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies and Chromium
        if: inputs.operation == 'capture'
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install chromium

      - name: Run ten real browser journeys and restore read-only before journey ten
        if: inputs.operation == 'capture'
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test \
            e2e/31-external-source-management-hosted.spec.ts \
            --project=chromium \
            --grep "@hosted-srcm" \
            --retries=0 \
            --reporter=list \
            --trace=off

      - name: Restore and verify safe runtime posture
        if: always() && inputs.operation == 'capture'
        shell: bash
        run: |
          set -euo pipefail
          state_dir="/run/pantheon-srcm-proof-${GITHUB_RUN_ID}"
          if sudo test -d "${state_dir}"; then
            sudo bash "${SRCM_PROOF_RUNTIME_SCRIPT}" restore "${GITHUB_RUN_ID}" "${EXPECTED_FE_SHA}" "${EXPECTED_BFF_SHA}"
            sudo bash "${SRCM_PROOF_RUNTIME_SCRIPT}" status "${GITHUB_RUN_ID}" "${EXPECTED_FE_SHA}" "${EXPECTED_BFF_SHA}"
            if sudo test -f "${state_dir}/restore-reconcile-only.json"; then
              sudo install -o "$(id -u)" -g "$(id -g)" -m 600 \
                "${state_dir}/restore-reconcile-only.json" \
                "${PANTHEON_AUDIT_OUT_DIR}/restore-reconcile-only.json"
            fi
          fi

      - name: Record sanitized post-proof posture
        if: always() && inputs.operation == 'capture' && steps.prepare.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          source_commands_raw="$(sudo docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' pantheon-source-ingest-1 | sed -n 's/^SOURCE_MANAGEMENT_COMMANDS_ENABLED=//p' | tail -1)"
          bff_commands_raw="$(sudo docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' pantheon-operator-bff-1 | sed -n 's/^PANTHEON_BFF_SOURCE_MANAGEMENT_COMMANDS_ENABLED=//p' | tail -1)"
          source_commands="${source_commands_raw:-0}"
          bff_commands="${bff_commands_raw:-0}"
          egress="$(sudo docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' pantheon-source-ingest-1 | sed -n 's/^PANTHEON_EXTERNAL_EGRESS=//p' | tail -1)"
          scheduler_restart="$(sudo docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' pantheon-source-ingest-scheduler-1)"
          scheduler_running="$(sudo docker inspect -f '{{.State.Running}}' pantheon-source-ingest-scheduler-1)"
          node -e 'const fs=require("node:fs");fs.writeFileSync(process.argv[1],JSON.stringify({schema_version:"pantheon.external-source-management.runtime-posture.v1",observed_at:new Date().toISOString(),SOURCE_MANAGEMENT_COMMANDS_ENABLED:process.argv[2],SOURCE_MANAGEMENT_COMMANDS_CONTAINER_ENV:process.argv[8]||null,SOURCE_MANAGEMENT_COMMANDS_EFFECTIVE_DEFAULT_APPLIED:process.argv[8]==="",PANTHEON_BFF_SOURCE_MANAGEMENT_COMMANDS_ENABLED:process.argv[3],PANTHEON_BFF_SOURCE_MANAGEMENT_COMMANDS_CONTAINER_ENV:process.argv[9]||null,PANTHEON_BFF_SOURCE_MANAGEMENT_COMMANDS_EFFECTIVE_DEFAULT_APPLIED:process.argv[9]==="",PANTHEON_EXTERNAL_EGRESS:process.argv[4],SOURCE_INGEST_CONTROLLER_MODE:"reconcile_only",SOURCE_INGEST_CONTROLLER_MAX_TICKS:"1",SOURCE_INGEST_CONTROLLER_RESTART_POLICY:process.argv[5],SOURCE_INGEST_CONTROLLER_RUNNING:process.argv[6],VITE_BFF_REAL_WRITES:"false",qualification_lease_id:process.argv[7]},null,2)+"\n")' \
            "${PANTHEON_AUDIT_OUT_DIR}/runtime-posture.json" \
            "${source_commands}" "${bff_commands}" "${egress}" "${scheduler_restart}" "${scheduler_running}" "${QUALIFICATION_LEASE_ID}" \
            "${source_commands_raw}" "${bff_commands_raw}"
          [[ "${source_commands}" == "0" ]]
          [[ "${bff_commands}" == "0" ]]
          [[ "${egress}" == "deny" ]]
          [[ "${scheduler_restart}" == "no" ]]
          [[ "${scheduler_running}" == "false" ]]

      - name: Check out exact Pantheon verifier and committed evidence
        if: inputs.operation == 'verify-only'
        shell: bash
        run: |
          set -euo pipefail
          verifier_root="${RUNNER_TEMP%/}/pantheon-srcm-verifier"
          git init -q "${verifier_root}"
          git -C "${verifier_root}" remote add origin https://github.com/ajoe734/pantheon.git
          git -C "${verifier_root}" fetch -q --depth=1 origin "${PANTHEON_VERIFIER_SHA}"
          git -C "${verifier_root}" checkout -q --detach FETCH_HEAD
          [[ "$(git -C "${verifier_root}" rev-parse HEAD)" == "${PANTHEON_VERIFIER_SHA}" ]]
          echo "PANTHEON_VERIFIER_ROOT=${verifier_root}" >> "${GITHUB_ENV}"

      - name: Run official offline and live hosted acceptance verifier
        if: inputs.operation == 'verify-only'
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${PANTHEON_VERIFIER_ROOT}/docs/deployment/evidence/external-source-management-phase1"
          python3 "${PANTHEON_VERIFIER_ROOT}/scripts/verify_external_source_management_acceptance.py" \
            --evidence-dir "${evidence_dir}" \
            --offline-only \
            --expected-fe-sha "${EXPECTED_FE_SHA}" \
            --expected-bff-sha "${EXPECTED_BFF_SHA}" \
            --expected-source-definitions-sha "${EXPECTED_SOURCE_DEFINITIONS_SHA}" \
            --output "${PANTHEON_AUDIT_OUT_DIR}/offline-verifier-result.json"
          python3 "${PANTHEON_VERIFIER_ROOT}/scripts/verify_external_source_management_acceptance.py" \
            --evidence-dir "${evidence_dir}" \
            --expected-fe-sha "${EXPECTED_FE_SHA}" \
            --expected-bff-sha "${EXPECTED_BFF_SHA}" \
            --expected-source-definitions-sha "${EXPECTED_SOURCE_DEFINITIONS_SHA}" \
            --output "${PANTHEON_AUDIT_OUT_DIR}/live-verifier-result.json"

      - name: Upload sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srcm-p1-hosted-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PANTHEON_AUDIT_OUT_DIR }}
          if-no-files-found: error
          retention-days: 90

      - name: Remove root-only temporary proof state
        if: always() && inputs.operation == 'capture'
        shell: bash
        run: |
          set -euo pipefail
          state_dir="/run/pantheon-srcm-proof-${GITHUB_RUN_ID}"
          if sudo test -d "${state_dir}"; then
            sudo rm -rf -- "${state_dir}"
          fi
